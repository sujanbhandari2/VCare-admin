# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  clock: ^1.1.2
  connectivity_plus: ^7.1.1
  cupertino_icons: ^1.0.9

  device_info_plus: ^13.1.0
  dio: ^5.9.2

  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  firebase_remote_config: ^6.4.0
  flutter_local_notifications: ^21.0.0
  flutter_riverpod: ^3.3.1
  flutter_svg: ^2.2.4
  fluttertoast: ^9.0.0
  fpdart: ^1.2.0

  go_router: ^17.2.3
  google_fonts: ^6.2.1
  google_sign_in: ^7.2.0
  health_messenger_ui:
    path: "/Users/sujan/Desktop/chat feature/chat feature/chat_app_package"
  lucide_icons: ^0.257.0

  hive_ce: ^2.19.3
  http: ^1.6.0

  image_picker: ^1.2.2
  in_app_update: ^4.2.5
  intl: ^0.20.2

  location: ^8.0.1

  package_info_plus: ^10.1.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pretty_qr_code: ^3.6.0
  flutter_secure_storage: ^11.0.0
  local_auth: ^3.0.2

  riverpod_annotation: ^4.0.2

  share_plus: ^13.1.0
  sign_in_with_apple: ^8.0.0
  sqflite: ^2.4.2+1

  url_launcher: ^6.3.2

  webview_flutter: ^4.13.1
  file_selector: ^1.1.0
  file_picker: ^12.0.0-beta.7
  file_saver: ^0.4.0
  gal: ^2.3.2
  pdf: ^3.12.0
  geocoding: ^5.0.0
  app_settings: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.0
  change_app_package_name: ^1.5.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  firebase_core_platform_interface: ^6.0.3
  location_platform_interface: ^6.0.1
  riverpod_generator: ^4.0.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/vcare/vcare-v-icon.webp
  remove_alpha_ios: true
  min_sdk_android: 21

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/svg/
    - assets/images/onboarding/
    - assets/images/vcare/
    - .env

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

